# Snapshot the repository traffic API into CSVs on the orphan `metrics` branch.
#
# GitHub only keeps a rolling 14-day window of traffic data, so a day that is
# never snapshotted is gone for good. The schedule fires on the 1st, 11th and
# 21st: cron cannot express "every 10 days", and these dates give a worst-case
# gap of 11 days, comfortably inside the window.
#
# Nothing here touches `main` - the CSVs live on their own branch so the default
# branch, CI and the release workflow stay untouched.
name: Metrics

on:
  schedule:
    - cron: '0 6 1,11,21 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the collector script
        uses: actions/checkout@v4

      - name: Check out the metrics branch
        uses: actions/checkout@v4
        with:
          ref: metrics
          path: metrics-data

      - name: Snapshot traffic and release downloads
        env:
          # The traffic API needs push rights. The built-in GITHUB_TOKEN is tried
          # first; set a METRICS_TOKEN secret (fine-grained PAT) if it 403s.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          METRICS_DIR: metrics-data
        run: python3 .github/scripts/collect_metrics.py

      - name: Commit the snapshot
        working-directory: metrics-data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic.csv releases.csv
          if git diff --cached --quiet; then
            echo 'No change since the last snapshot.'
            exit 0
          fi
          git commit -m "metrics: snapshot $(date -u +%Y-%m-%d)"
          git push
