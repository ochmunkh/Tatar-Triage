name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    name: Linux (bash-n / shellcheck / run / schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n linux/tatar-linux.sh

      - name: ShellCheck (errors only)
        run: shellcheck --severity=error linux/tatar-linux.sh

      - name: Smoke run + summary.json schema validation
        run: |
          chmod +x linux/tatar-linux.sh
          ./linux/tatar-linux.sh --all --silent --caseid CI --output /tmp/tt || true
          d="$(find /tmp/tt -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "Output dir: $d"
          test -s "$d/summary.json"   || { echo "summary.json missing"; exit 1; }
          test -s "$d/findings.json"  || { echo "findings.json missing"; exit 1; }
          python3 -m pip install --quiet jsonschema
          python3 .github/scripts/validate_summary.py "$d/summary.json"  schema/summary.schema.json
          python3 .github/scripts/validate_summary.py "$d/findings.json" schema/findings.schema.json

      - name: Allowlist + IOC run (v1.2 engines) + schema validation
        run: |
          ./linux/tatar-linux.sh --modules sysinfo,process,network,users,persistence,hashes --silent --caseid CI-IOC \
              --allowlist allowlist.sample.json --ioc ioc.sample.json --output /tmp/tt2 || true
          d="$(find /tmp/tt2 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -s "$d/summary.json" || { echo "summary.json missing (allowlist/ioc run)"; exit 1; }
          python3 .github/scripts/validate_summary.py "$d/summary.json"  schema/summary.schema.json
          python3 .github/scripts/validate_summary.py "$d/findings.json" schema/findings.schema.json

      - name: IOC boundary unit tests
        run: bash tests/test-ioc-boundary.sh

      - name: Allowlist path-extraction unit tests
        run: bash tests/test-allowlist-path.sh

      # The two language halves of a README drift apart. This compares their
      # STRUCTURE against a per-file baseline and fails naming the mismatch.
      # linux/README.md is held to an exact mirror; README.md carries a
      # recorded English-only surplus. Both are checked, because the Linux half
      # was written from nothing and unguarded is how it would go stale.
      - name: README bilingual parity
        run: |
          python3 .github/scripts/check_readme_parity.py README.md
          python3 .github/scripts/check_readme_parity.py linux/README.md

      - name: Contract tests
        run: bash tests/run-tests.sh

  windows:
    name: Windows (parse / PSScriptAnalyzer / run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The schema validator below is Python, and the hosted Windows image only
      # guarantees `python` / `py -3` - there is no `python3` on PATH there. Pin
      # an interpreter explicitly so the validation steps cannot take the whole
      # Windows job red for a reason that has nothing to do with the collector.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse check (0 syntax errors)
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content ./Tatar.ps1 -Raw), [ref]$e) | Out-Null
          if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
          "Parse OK: 0 syntax errors"

      - name: PSScriptAnalyzer (fail on Error severity)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path ./Tatar.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Sort-Object Severity -Descending | Format-Table -AutoSize | Out-String | Write-Host
          $errs = @($r | Where-Object { $_.Severity -eq 'Error' })
          if ($errs.Count -gt 0) { Write-Error "PSScriptAnalyzer found $($errs.Count) error(s)"; exit 1 }
          "PSScriptAnalyzer OK (0 errors)"

      - name: Smoke run + JSON validation
        shell: pwsh
        run: |
          pwsh -File ./Tatar.ps1 -Modules sysinfo,users,process,persistence -Silent -OutputPath "$env:TEMP\tt"
          "Collector exit code: $LASTEXITCODE"
          $d = (Get-ChildItem "$env:TEMP\tt" -Directory | Select-Object -First 1).FullName
          foreach ($f in 'summary.json','findings.json') {
            $fp = Join-Path $d $f
            if (-not (Test-Path $fp)) { throw "$f missing" }
            Get-Content $fp -Raw | ConvertFrom-Json | Out-Null
            "OK: $f is valid JSON"
          }
          # The flagship producer is held to the SAME schema as the Linux one,
          # through the same script: until v1.2.6 only Linux was validated, so
          # the Windows half of the "unified" contract was never checked.
          python -m pip install --quiet jsonschema
          python .github/scripts/validate_summary.py (Join-Path $d 'summary.json')  schema/summary.schema.json
          python .github/scripts/validate_summary.py (Join-Path $d 'findings.json') schema/findings.schema.json

      - name: Allowlist + IOC run (v1.2 engines)
        shell: pwsh
        run: |
          pwsh -File ./Tatar.ps1 -Modules sysinfo,users,process,persistence,hashes -Silent -Allowlist ./allowlist.sample.json -IOCFile ./ioc.sample.json -OutputPath "$env:TEMP\tt2"
          "Collector exit code: $LASTEXITCODE"
          $d = (Get-ChildItem "$env:TEMP\tt2" -Directory | Select-Object -First 1).FullName
          $s = Get-Content (Join-Path $d 'summary.json') -Raw | ConvertFrom-Json
          if ($s.schemaVersion -ne '1.2') { throw "schemaVersion $($s.schemaVersion) != 1.2" }
          if ($s.version -notmatch '^\d+\.\d+\.\d+$') { throw "tool version missing/invalid: $($s.version)" }
          if (($s.activeFindingsCount + $s.suppressedCount) -ne @($s.findings).Count) { throw 'active+suppressed != findings' }
          foreach ($f in @($s.findings)) { foreach ($k in 'id','confidence','suppressed') { if (-not ($f.PSObject.Properties.Name -contains $k)) { throw "finding without $k" } } }
          python .github/scripts/validate_summary.py (Join-Path $d 'summary.json')  schema/summary.schema.json
          python .github/scripts/validate_summary.py (Join-Path $d 'findings.json') schema/findings.schema.json
          "OK: allowlist/ioc run; version=$($s.version) active=$($s.activeFindingsCount) suppressed=$($s.suppressedCount)"

      - name: IOC boundary unit tests
        shell: pwsh
        run: pwsh -File tests/Test-IocBoundary.ps1

      - name: Allowlist path-extraction unit tests
        shell: pwsh
        run: pwsh -File tests/Test-AllowlistPath.ps1

      - name: Service ImagePath unit tests
        shell: pwsh
        run: pwsh -File tests/Test-ServicePath.ps1

      # The Windows-only modules never execute in CI's Linux job and only
      # partly in this one, so the parts of the WINDOWS_STATIC_REVIEW fixes
      # that are pure - the Get-WinEvent failure classifier, the Run-key list -
      # are unit tested directly. See tests/WINDOWS_STATIC_REVIEW.md.
      - name: Static-review fix unit tests
        shell: pwsh
        run: pwsh -File tests/Test-StaticReviewFixes.ps1

      - name: Contract tests
        shell: pwsh
        run: pwsh -File tests/Invoke-Tests.ps1

  docs-parity:
    name: Docs parity (badges / bilingual module lists / ATT&CK coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every fact this checks is derivable from the collectors, and the git
      # history shows each one has already needed a dedicated repair commit.
      - name: Docs match the code
        run: python3 .github/scripts/check_docs_parity.py .