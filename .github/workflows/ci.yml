name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    name: Linux (bash-n / shellcheck / run / schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: bash -n linux/tatar-linux.sh

      - name: ShellCheck (errors only)
        run: shellcheck --severity=error linux/tatar-linux.sh

      - name: Smoke run + summary.json schema validation
        run: |
          chmod +x linux/tatar-linux.sh
          ./linux/tatar-linux.sh --all --silent --caseid CI --output /tmp/tt || true
          d="$(find /tmp/tt -mindepth 1 -maxdepth 1 -type d | head -n1)"
          echo "Output dir: $d"
          test -s "$d/summary.json"   || { echo "summary.json missing"; exit 1; }
          test -s "$d/findings.json"  || { echo "findings.json missing"; exit 1; }
          python3 -m pip install --quiet jsonschema
          python3 .github/scripts/validate_summary.py "$d/summary.json"  schema/summary.schema.json
          python3 .github/scripts/validate_summary.py "$d/findings.json" schema/findings.schema.json

      - name: Allowlist + IOC run (v1.2 engines) + schema validation
        run: |
          ./linux/tatar-linux.sh --modules sysinfo,process,network,users,persistence,hashes --silent --caseid CI-IOC \
              --allowlist allowlist.sample.json --ioc ioc.sample.json --output /tmp/tt2 || true
          d="$(find /tmp/tt2 -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -s "$d/summary.json" || { echo "summary.json missing (allowlist/ioc run)"; exit 1; }
          python3 .github/scripts/validate_summary.py "$d/summary.json"  schema/summary.schema.json
          python3 .github/scripts/validate_summary.py "$d/findings.json" schema/findings.schema.json

      - name: IOC boundary unit tests
        run: bash tests/test-ioc-boundary.sh

      # json_escape is the single point where collected bytes become JSON.
      # The test drives all three of its paths - including the no-python3
      # fallback, which it forces by shadowing python3, because CI always has
      # python3 and that fallback therefore stayed broken for three releases.
      - name: JSON escaper unit tests
        run: bash tests/test-json-escape.sh

      # Schema 1.3 put the first array (paths[]) into a flat, separator
      # delimited record. That is only safe while host-controlled strings
      # cannot carry a separator into it, so the injection defence is pinned
      # by a test rather than by a comment.
      - name: Flat-record array / separator-injection unit tests
        run: bash tests/test-gs-array.sh


      # Evidence correlation is the only pass that raises a finding's confidence
      # on the strength of ANOTHER finding, so the ways it must NOT fire are
      # what these assert: a module corroborating itself, a suppressed finding,
      # an IOC hit being demoted, and the case-sensitivity rule, which is the
      # OPPOSITE on each platform and is therefore asserted on both.
      - name: Evidence correlation unit tests
        run: bash tests/test-correlation.sh

      - name: Allowlist path-extraction unit tests
        run: bash tests/test-allowlist-path.sh

      # The two language halves of a README drift apart. This compares their
      # STRUCTURE against a per-file baseline and fails naming the mismatch.
      # linux/README.md is held to an exact mirror; README.md carries a
      # recorded English-only surplus. Both are checked, because the Linux half
      # was written from nothing and unguarded is how it would go stale.
      - name: README bilingual parity
        run: |
          python3 .github/scripts/check_readme_parity.py README.md
          python3 .github/scripts/check_readme_parity.py linux/README.md

      - name: Contract tests
        run: bash tests/run-tests.sh

  windows:
    name: Windows (parse / PSScriptAnalyzer / run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The schema validator below is Python, and the hosted Windows image only
      # guarantees `python` / `py -3` - there is no `python3` on PATH there. Pin
      # an interpreter explicitly so the validation steps cannot take the whole
      # Windows job red for a reason that has nothing to do with the collector.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse check (0 syntax errors)
        shell: pwsh
        run: |
          $e = $null
          [System.Management.Automation.PSParser]::Tokenize((Get-Content ./Tatar.ps1 -Raw), [ref]$e) | Out-Null
          if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
          "Parse OK: 0 syntax errors"

      - name: PSScriptAnalyzer (fail on Error severity)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path ./Tatar.ps1 -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Sort-Object Severity -Descending | Format-Table -AutoSize | Out-String | Write-Host
          $errs = @($r | Where-Object { $_.Severity -eq 'Error' })
          if ($errs.Count -gt 0) { Write-Error "PSScriptAnalyzer found $($errs.Count) error(s)"; exit 1 }
          "PSScriptAnalyzer OK (0 errors)"

      - name: Smoke run + JSON validation
        shell: pwsh
        run: |
          pwsh -File ./Tatar.ps1 -Modules sysinfo,users,process,persistence -Silent -OutputPath "$env:TEMP\tt"
          "Collector exit code: $LASTEXITCODE"
          $d = (Get-ChildItem "$env:TEMP\tt" -Directory | Select-Object -First 1).FullName
          foreach ($f in 'summary.json','findings.json') {
            $fp = Join-Path $d $f
            if (-not (Test-Path $fp)) { throw "$f missing" }
            Get-Content $fp -Raw | ConvertFrom-Json | Out-Null
            "OK: $f is valid JSON"
          }
          # The flagship producer is held to the SAME schema as the Linux one,
          # through the same script: until v1.2.6 only Linux was validated, so
          # the Windows half of the "unified" contract was never checked.
          python -m pip install --quiet jsonschema
          python .github/scripts/validate_summary.py (Join-Path $d 'summary.json')  schema/summary.schema.json
          python .github/scripts/validate_summary.py (Join-Path $d 'findings.json') schema/findings.schema.json

      - name: Allowlist + IOC run (allowlist / IOC engines)
        shell: pwsh
        run: |
          pwsh -File ./Tatar.ps1 -Modules sysinfo,users,process,persistence,hashes -Silent -Allowlist ./allowlist.sample.json -IOCFile ./ioc.sample.json -OutputPath "$env:TEMP\tt2"
          "Collector exit code: $LASTEXITCODE"
          $d = (Get-ChildItem "$env:TEMP\tt2" -Directory | Select-Object -First 1).FullName
          $s = Get-Content (Join-Path $d 'summary.json') -Raw | ConvertFrom-Json
          # schemaVersion is NOT checked against a literal here. It was, and that
          # literal became the third copy of the number - bumped by hand at every
          # schema release and forgotten at this one, failing CI on the release
          # commit itself. The two contract harnesses already assert the exact
          # value, and check_contract_parity.py guarantees they assert the same
          # one, so this step validates the document against the schema and
          # leaves the version to the place that owns it.
          if ($s.version -notmatch '^\d+\.\d+\.\d+$') { throw "tool version missing/invalid: $($s.version)" }
          if (($s.activeFindingsCount + $s.suppressedCount) -ne @($s.findings).Count) { throw 'active+suppressed != findings' }
          foreach ($f in @($s.findings)) { foreach ($k in 'id','confidence','suppressed') { if (-not ($f.PSObject.Properties.Name -contains $k)) { throw "finding without $k" } } }
          python .github/scripts/validate_summary.py (Join-Path $d 'summary.json')  schema/summary.schema.json
          python .github/scripts/validate_summary.py (Join-Path $d 'findings.json') schema/findings.schema.json
          "OK: allowlist/ioc run; version=$($s.version) active=$($s.activeFindingsCount) suppressed=$($s.suppressedCount)"

      - name: IOC boundary unit tests
        shell: pwsh
        run: pwsh -File tests/Test-IocBoundary.ps1

      - name: EncodedCommand pattern unit tests
        shell: pwsh
        run: pwsh -File tests/Test-EncodedArg.ps1

      - name: Allowlist path-extraction unit tests
        shell: pwsh
        run: pwsh -File tests/Test-AllowlistPath.ps1

      - name: Service ImagePath unit tests
        shell: pwsh
        run: pwsh -File tests/Test-ServicePath.ps1

      - name: Evidence correlation unit tests
        shell: pwsh
        run: pwsh -File tests/Test-Correlation.ps1

      # '-Modules a,b' arrives as an ARRAY from a PowerShell prompt and as a
      # literal string from cmd.exe. Both shapes have to reach the same module
      # list; only the cmd.exe one ever did before 1.5.0.
      - name: Argument-value parsing unit tests
        shell: pwsh
        run: pwsh -File tests/Test-ArgValue.ps1

      # The Windows-only modules never execute in CI's Linux job and only
      # partly in this one, so the parts of the WINDOWS_STATIC_REVIEW fixes
      # that are pure - the Get-WinEvent failure classifier, the Run-key list -
      # are unit tested directly. See tests/WINDOWS_STATIC_REVIEW.md.
      - name: Static-review fix unit tests
        shell: pwsh
        run: pwsh -File tests/Test-StaticReviewFixes.ps1

      - name: Contract tests
        shell: pwsh
        run: pwsh -File tests/Invoke-Tests.ps1

  # Windows PowerShell 5.1 is what `#Requires -Version 5.1` declares and what
  # ships preinstalled on every Windows 10/11 host, which makes it the edition
  # most responders actually run this with. Every step in the job above uses
  # pwsh 7. That gap is not theoretical: it is how summary.json and
  # findings.json shipped with a UTF-8 BOM for three releases (Out-File
  # -Encoding UTF8 writes one on 5.1 and not on 7, and a BOM is not valid JSON
  # text to a strict parser), and how an array subexpression over a
  # List[object] came to evaluate to empty on 5.1 alone. Both were found by
  # hand. This job is so the next one is not.
  #
  # Deliberately NOT a copy of the pwsh job: PSScriptAnalyzer and the pure
  # pattern unit tests exercise logic that does not vary by edition, and the
  # pwsh job already runs them. What belongs here is everything whose behaviour
  # CAN differ - the collector itself, the documents it writes, and the
  # contract suite that reads them back.
  windows-ps51:
    name: Windows PowerShell 5.1 (run / schema / contract)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this really is Windows PowerShell 5.1
        shell: powershell
        run: |
          $v = $PSVersionTable.PSVersion
          $ed = $PSVersionTable.PSEdition
          "PSVersion: $v  Edition: $ed"
          if ($v.Major -ne 5) { throw "expected PowerShell 5.x, got $v - this job would silently duplicate the pwsh job" }
          if ($ed -ne 'Desktop') { throw "expected the Desktop edition, got $ed" }

      - name: Parse check (0 syntax errors)
        shell: powershell
        run: |
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./Tatar.ps1).Path, [ref]$null, [ref]$e) | Out-Null
          if ($e.Count -gt 0) { $e | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }; throw "$($e.Count) parse error(s)" }
          "Parse OK: 0 syntax errors"

      - name: Smoke run + JSON validation
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./Tatar.ps1 -Modules sysinfo,users,process,persistence -Silent -OutputPath "$env:TEMP\tt51"
          "Collector exit code: $LASTEXITCODE"
          $d = (Get-ChildItem "$env:TEMP\tt51" -Directory | Select-Object -First 1).FullName
          foreach ($f in 'summary.json','findings.json') {
            $fp = Join-Path $d $f
            if (-not (Test-Path $fp)) { throw "$f missing" }
            # Read the BYTES. The defect this job exists for is a byte-order
            # mark, and ConvertFrom-Json on 5.1 accepts one happily - so
            # checking only that the document parses here would have passed on
            # the exact bug that shipped.
            $b = [System.IO.File]::ReadAllBytes($fp)
            if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { throw "$f starts with a UTF-8 BOM" }
            Get-Content $fp -Raw | ConvertFrom-Json | Out-Null
            "OK: $f is valid JSON and has no BOM"
          }
          # python, not ConvertFrom-Json: a strict parser is the point. .NET is
          # forgiving about things a SIEM is not.
          python -m pip install --quiet jsonschema
          python .github/scripts/validate_summary.py (Join-Path $d 'summary.json')  schema/summary.schema.json
          python .github/scripts/validate_summary.py (Join-Path $d 'findings.json') schema/findings.schema.json

      - name: Allowlist + IOC run (allowlist / IOC engines)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./Tatar.ps1 -Modules sysinfo,users,process,persistence,hashes -Silent -Allowlist ./allowlist.sample.json -IOCFile ./ioc.sample.json -OutputPath "$env:TEMP\tt51b"
          "Collector exit code: $LASTEXITCODE"
          $d = (Get-ChildItem "$env:TEMP\tt51b" -Directory | Select-Object -First 1).FullName
          python .github/scripts/validate_summary.py (Join-Path $d 'summary.json')  schema/summary.schema.json
          python .github/scripts/validate_summary.py (Join-Path $d 'findings.json') schema/findings.schema.json

      # Run here as well as in the pwsh 7 job, and for a specific reason: the
      # first draft of Invoke-EvidenceCorrelation used @(...) over a
      # List[object], which throws "Argument types do not match" on 5.1 and
      # works on pwsh 7. That is the exact class of defect this job exists for,
      # and it was caught by running these cases on 5.1.
      - name: Evidence correlation unit tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Test-Correlation.ps1

      - name: Argument-value parsing unit tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Test-ArgValue.ps1

      - name: Contract tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Invoke-Tests.ps1

  docs-parity:
    name: Docs parity (badges / bilingual module lists / ATT&CK coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every fact this checks is derivable from the collectors, and the git
      # history shows each one has already needed a dedicated repair commit.
      - name: Docs match the code
        run: python3 .github/scripts/check_docs_parity.py .

      # The Windows and Linux contract harnesses run in SEPARATE jobs on
      # separate runners, so until now nothing compared them. A rule dropped
      # from one of them would leave the schema valid, both jobs green, and
      # that edition quietly no longer held to the contract. This job can read
      # both files, so it is where the comparison belongs.
      - name: Both editions are held to the same contract
        run: python3 .github/scripts/check_contract_parity.py .

      # TATAR is run on live production endpoints on the strength of eight
      # claims in docs/AV-SAFETY.md -- no egress, no credential dumping, no
      # AMSI tampering, nothing EDR-sensitive on by default. Those are easy
      # promises to make in a document and easy to break in a commit; one
      # Invoke-WebRequest for a "quick version check" and the document is a
      # lie that nobody notices until a customer's EDR notices for us. Each
      # claim has an ID and a check, cross-referenced both ways: an
      # undocumented check and an unenforced claim both fail here.
      - name: The AV-safety claims still hold
        run: python3 .github/scripts/check_av_safety.py .
